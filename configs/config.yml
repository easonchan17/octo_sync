logger:
  level: info
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - kind: console
    - kind: file
      path: "output/logs/octopus.log"
      max_size: 10485760
      backup_count: 5

task_thread_pool:
  max_workers: 10

browser:
  headless: false
  channel:  "chrome"
  page_pool_size: 5

interceptor:
  zcy:
    category:
      url: "https://www.zcygov.cn/"
      rules:
        - type: http
          pattern: "https://www.zcygov.cn/front/index/home/category/tree"
          receiver: "core.browser.components.receivers.zcy.CategoryReceiver"
    sub_category:
      url_template: "https://www.zcygov.cn/eevees/search?fcid={cid}&holdParam=false&utm=luban.luban-PC-194.161-market-menubar-pc.{salt}.3146d9e0834e11f0a492c702f45b45cf"
      rules:
        - type: http
          pattern: "https://www.zcygov.cn/front/index/search/search"
          receiver: "core.browser.components.receivers.zcy.SubCategoryReceiver"
    brand:
      url_template: "https://www.zcygov.cn/eevees/search?fcid={scid}&holdParam=false&utm=luban.luban-PC-194.161-market-menubar-pc.{salt}.3146d9e0834e11f0a492c702f45b45cf"
      rules:
        - type: http
          pattern: "https://www.zcygov.cn/front/index/search/search"
          receiver: "core.browser.components.receivers.zcy.BrandReceiver"
    product:
      page_size: 100
      max_page_no: 10
      sort: "0_0_0_0_0_0_0_2"
      url_template: "https://www.zcygov.cn/eevees/search?fcid={scid}&holdParam=false&utm=luban.luban-PC-194.161-market-menubar-pc.{salt}.3146d9e0834e11f0a492c702f45b45cf"
      rules:
        - type: http
          pattern: "https://www.zcygov.cn/front/index/search/search"
          sender: "core.browser.components.senders.zcy.SearchProductSender"
          receiver: "core.browser.components.receivers.zcy.ProductReceiver"
    product_detail:
      url_template: "https://www.zcygov.cn/items/{item_id}"
      rules:
        - type: http
          pattern: "https://www.zcygov.cn/front/detail/item/.*"
          receiver: "core.browser.components.receivers.zcy.ProductDetailReceiver"
  fbref:
    countries:
      url: "https://fbref.com/en/countries/"
      rules:
        - type: dom
          receiver: "core.browser.components.receivers.fbref.CountryReceiver"
    competitions:
      url: "https://fbref.com/en/comps/"
      rules:
        - type: dom
          receiver: "core.browser.components.receivers.fbref.CompetitionReceiver"
    clubs:
      url_template: "https://fbref.com/en/country/clubs/{country_code}/{country_name}-Football-Clubs"
      rules:
        - type: dom
          receiver: "core.browser.components.receivers.fbref.ClubReceiver"
    comp_teams:
      url_template: "https://fbref.com/en/comps/{comp_code}/{season}/{season}-{comp_name}-Stats"
      rules:
        - type: dom
          receiver: "core.browser.components.receivers.fbref.CompTeamReceiver"
    match_results:
      url_template: "https://fbref.com/en/squads/{team_code}/{season}/matchlogs/all_comps/schedule/{team_name}-Scores-and-Fixtures-All-Competitions"
      rules:
        - type: dom
          receiver: "core.browser.components.receivers.fbref.MatchResultReceiver"
    gca:
      url_template: "https://fbref.com/en/squads/{team_code}/{season}/matchlogs/all_comps/gca/{team_name}-Match-Logs-All-Competitions"
      rules:
        - type: dom
          receiver: "core.browser.components.receivers.fbref.GoalAndShotCreationReceiver"
    passing:
      url_template: "https://fbref.com/en/squads/{team_code}/{season}/matchlogs/all_comps/passing/{team_name}-Match-Logs-All-Competitions"
      rules:
        - type: dom
          receiver: "core.browser.components.receivers.fbref.PassingReceiver"
    defensive_actions:
      url_template: "https://fbref.com/en/squads/{team_code}/{season}/matchlogs/all_comps/defense/{team_name}-Match-Logs-All-Competitions"
      rules:
        - type: dom
          receiver: "core.browser.components.receivers.fbref.DefensiveActionReceiver"
    shooting:
      url_template: "https://fbref.com/en/squads/{team_code}/{season}/matchlogs/all_comps/shooting/{team_name}-Match-Logs-All-Competitions"
      rules:
        - type: dom
          receiver: "core.browser.components.receivers.fbref.ShootingReceiver"
    goalkeeping:
      url_template: "https://fbref.com/en/squads/{team_code}/{season}/matchlogs/all_comps/keeper/{team_name}-Match-Logs-All-Competitions"
      rules:
        - type: dom
          receiver: "core.browser.components.receivers.fbref.GoalkeepingReceiver"
    player_match_stats:
      url_template: "https://fbref.com{match_report_url}"
      rules:
        - type: dom
          receiver: "core.browser.components.receivers.fbref.PlayerMatchStatsReceiver"
  fotmob:
    fixtures:
      url_template: "https://www.fotmob.com/?date={date}"
      debug: false
      rules:
        - type: http
          pattern: "https://www.fotmob.com/api/data/matches"
          sender: "core.browser.components.senders.fotmob.SearchFixtureSender"
          receiver: "core.browser.components.receivers.fotmob.FixtureReceiver"
  pinnacle:
    odds:
      url_template: "https://www.pinnacle.com/en/soccer/{country_name}-{league_name}/matchups/#all"
      debug: false
      rules:
        - type: http
          pattern: "https://guest.api.arcadia.pinnacle.com/.*/leagues/.*/matchups"
          receiver: "core.browser.components.receivers.pinnacle.MatchReceiver"
        - type: http
          pattern: "https://guest.api.arcadia.pinnacle.com/.*/leagues/.*/markets/straight"
          receiver: "core.browser.components.receivers.pinnacle.OddsReceiver"

http:
  host: "0.0.0.0"
  port: 8080

database:
  db_host: "localhost"
  db_port: 5432
  db_name: "octopus"
  db_user: "octopus"
  db_password: "123456"
  pool_config:
    pool_size: 10
    max_overflow: 5
    pool_timeout: 30
    pool_recycle: 300

training:
  artifact:
    model: artifacts/models
    dataset: artifacts/dataset
  tasks:
    winball:
      objective:
        type: classification
        target_col: "target"
        target_names: ["Home Loss", "Draw", "Home Win"]
        eval_set_size: 0.1
        test_set_size: 0.2
        balanced: false

      model:
        name: xgboost
        params:
          early_stopping_rounds: 100
          objective: multi:softprob
          eval_metric: mlogloss
          tree_method: hist
          num_class: 3
          random_state: 1
          n_jobs: -1

      optimizer:
        name: bayes_search_cv
        params:
          n_iter: 100
          scoring: neg_log_loss
          random_state: 1
          n_jobs: 1
          verbose: 0
          cv: 5
          search_spaces:
            max_depth: { type: Integer, low: 3, high: 10 }
            learning_rate: { type: Real, low: 0.01, high: 0.15, prior: log-uniform }
            n_estimators: { type: Integer, low: 500, high: 3000 }
            min_child_weight: { type: Integer, low: 1, high: 20 }
            gamma: { type: Real, low: 0, high: 5.0 }
            subsample: { type: Real, low: 0.5, high: 0.9 }
            colsample_bytree: { type: Real, low: 0.5, high: 0.9 }
            reg_alpha: { type: Real, low: 1.0e-5, high: 10, prior: log-uniform }
            reg_lambda: { type: Real, low: 1.0e-5, high: 10, prior: log-uniform }
