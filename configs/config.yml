logger:
  level: info
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - kind: console
    - kind: file
      path: "output/logs/octopus.log"
      max_size: 10485760
      backup_count: 5

task_thread_pool:
  max_workers: 32

browser:
  options:
    headless: false
    geoip: false
    os:
      - "windows"
      - "macos"
      - "linux"
    humanize: true
    firefox_user_prefs:
      browser.tabs.remote.useCrossOriginOpenerPolicy: false
      network.cookie.cookieBehavior: 0
  viewport:
    width: 1920
    height: 1080
  page_pool_size: 5
  page_limit: 30
  shutdown_timeout: 60.0

http:
  host: "127.0.0.1"
  port: 8080

database:
  db_host: "localhost"
  db_port: 5432
  db_name: "octopus"
  db_user: "octopus"
  db_password: "123456"
  pool_config:
    pool_size: 10
    max_overflow: 5
    pool_timeout: 30
    pool_recycle: 300

artifact:
  model: artifacts/models
  dataset:
    training: artifacts/dataset/training
    prediction: artifacts/dataset/prediction
    odds: artifacts/dataset/odds

training:
  tasks:
    winball:
      objective:
        type: classification
        target_col: "target"
        target_names: ["Home Loss", "Draw", "Home Win"]
        eval_set_size: 0.1
        test_set_size: 0.2
        balanced: false

      model:
        name: xgboost
        params:
          early_stopping_rounds: 100
          objective: multi:softprob
          eval_metric: mlogloss
          tree_method: hist
          num_class: 3
          random_state: 1
          n_jobs: -1

      optimizer:
        name: bayes_search_cv
        params:
          n_iter: 100
          scoring: neg_log_loss
          random_state: 1
          n_jobs: 1
          verbose: 0
          cv: 5
          search_spaces:
            max_depth: { type: Integer, low: 3, high: 10 }
            learning_rate: { type: Real, low: 0.01, high: 0.15, prior: log-uniform }
            n_estimators: { type: Integer, low: 500, high: 3000 }
            min_child_weight: { type: Integer, low: 1, high: 20 }
            gamma: { type: Real, low: 0, high: 5.0 }
            subsample: { type: Real, low: 0.5, high: 0.9 }
            colsample_bytree: { type: Real, low: 0.5, high: 0.9 }
            reg_alpha: { type: Real, low: 1.0e-5, high: 10, prior: log-uniform }
            reg_lambda: { type: Real, low: 1.0e-5, high: 10, prior: log-uniform }
