logger:
  level: info
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - kind: console
    - kind: file
      path: "output/logs/octopus.log"
      max_size: 10485760
      backup_count: 5

task_thread_pool:
  max_workers: 64

browser:
  request_interval: 20.0
  max_backoff: 300.0
  page_pool_size: 5
  sys_mem_threshold: 90
  failure_threshold: 5
  addons:
    - "core/browser/extensions/oddsportal_tracer"
  launch_options:
    headless: true
    geoip: true
    os:
      - "windows"
      - "macos"
    humanize: true
    firefox_user_prefs:
      browser.tabs.remote.useCrossOriginOpenerPolicy: false
      network.cookie.cookieBehavior: 0
  viewport:
    width: 1920
    height: 1080

database:
  pool_config:
    pool_size: 20
    max_overflow: 30
    pool_timeout: 60
    pool_pre_ping: true
    pool_recycle: 300

resource:
  model: artifacts/models
  report: artifacts/reports
  dataset:
    training: artifacts/dataset/training
    prediction: artifacts/dataset/prediction
  asset: assets

training:
  tasks:
    winball_club:
      objective:
        type: classification
        target_col: "target"
        target_names: ["Home Loss", "Draw", "Home Win"]
        eval_set_size: 0.1
        calibration_set_size: 0.1
        test_set_size: 0.2
        exclude_cols:
          - "away_rating_ability_mean"
          - "away_total_luck"
          - "home_total_luck"
          - "home_creativity_ability_sum"
          - "away_defense_ability_sum"
          - "sharp_vs_market_away_open_diff"
          - "away_attack_form"
          - "home_threat_per_entry_ema_5"
          - "away_threat_per_entry_ema_5"
          - "away_disruption_ema_5"
          - "home_attack_ability"
          - "sharp_vs_market_home_open_diff"
          - "creativity_form_sum_diff"
          - "away_creativity_ability_sum"
          - "home_defense_form_sum"
          - "home_rating_ability_mean"
          - "away_defense_form"
          - "home_defense_ability_sum"
          - "creativity_ability_sum_diff"
          - "away_aerial_form_max"
          - "home_npxga_ema_5"
          - "ah_line_up_ratio"
          - "away_gk_rest_days"
          - "away_keeper_high_claim_per_90_adj_ema_5"
          - "away_shots_on_target_ema_5"
          - "home_long_passes_ema_5"
          - "away_shot_quality_index_ema_5"
          - "away_rating_form_std"
          - "away_final_third_entry_rate_ema_5"
          - "away_points_ema_5_at_home"
          - "away_schedule_rest_days"
          - "home_long_passes_acc_ema_5"
          - "away_prob_open_std"
          - "away_tackles_ema_5"
          - "away_rating_form_mean"
          - "market_vig_open_std"
          - "defense_form_sum_diff"
          - "passes_into_final_third_ema_5_diff"
          - "away_big_chances_missed_rate_ema_5"
          - "away_venue_dependency"
          - "home_defense_form_over_ability"
          - "away_shots_conversion_ema_5"
          - "defense_ability_sum_diff"
          - "crosses_acc_ema_5_diff"
          - "crosses_ema_5_diff"
          - "home_progression_ability_sum"
          - "home_rating_form_std"
          - "home_keeper_high_claim_per_90_adj_ema_20"
          - "aerial_ability_max_diff"
          - "home_crosses_acc_ema_5"
          - "home_venue_dependency"
          - "home_prob_close_std"
          - "home_shots_conversion_ema_5"
          - "home_defense_form"
          - "away_rating_form_min"
          - "home_passes_into_final_third_ema_5"
          - "home_keeper_saves_ema_5"
          - "away_point_sum_5"
          - "away_rating_ability_max"
          - "point_sum_5_diff"
          - "home_npxg_per_shot_ema_5"
          - "away_finish_ability_sum"
          - "home_attack_form_over_ability"
          - "away_rating_form_max"
          - "big_chances_missed_rate_ema_5_diff"
          - "home_progression_form_sum"
          - "home_shots_acc_ema_5"
          - "away_interceptions_ema_5"
          - "npxg_per_shot_ema_5_diff"
          - "shots_conversion_ema_5_diff"
          - "home_big_chances_missed_rate_ema_5"
          - "home_point_sum_5"
          - "away_big_chances_ema_5"
          - "away_npxg_per_shot_ema_5"
          - "away_keeper_saves_ema_5"
          - "away_keeper_performance_ema_5"
          - "home_tackles_ema_5"
          - "away_shots_acc_ema_5"
          - "home_opp_half_pass_rate_ema_5"
          - "progression_form_sum_diff"
          - "finish_form_sum_diff"
          - "away_aerial_ability_max"
          - "away_keeper_sweeper_per_90_adj_ema_20"
          - "market_median_ah_line"
          - "home_net_advantage"

      model:
        name: xgboost
        params:
          n_estimators: 5000
          early_stopping_rounds: 150
          objective: multi:softprob
          eval_metric: mlogloss
          tree_method: hist
          num_class: 3
          random_state: 1
          n_jobs: -1

      optimizer:
        name: bayes_search_cv
        params:
          n_iter: 200
          scoring: neg_log_loss
          random_state: 1
          n_jobs: 1
          verbose: 0
          cv: 5
          search_spaces:
            max_depth: { type: Integer, low: 2, high: 8 }
            learning_rate: { type: Real, low: 0.001, high: 0.1, prior: log-uniform }
            min_child_weight: { type: Integer, low: 8, high: 60 }
            gamma: { type: Real, low: 1.0, high: 10.0 }
            subsample: { type: Real, low: 0.3, high: 0.8 }
            colsample_bytree: { type: Real, low: 0.2, high: 0.8 }
            reg_alpha: { type: Real, low: 0.1, high: 10, prior: log-uniform }
            reg_lambda: { type: Real, low: 1.0, high: 50, prior: log-uniform }

    winball_national:
      objective:
        type: classification
        target_col: "target"
        target_names: ["Home Loss", "Draw", "Home Win"]
        eval_set_size: 0.1
        calibration_set_size: 0.1
        test_set_size: 0.2
        exclude_cols:
          - "away_rating_ability_mean"
          - "away_total_luck"
          - "home_total_luck"
          - "home_creativity_ability_sum"
          - "away_defense_ability_sum"
          - "sharp_vs_market_away_open_diff"

      model:
        name: xgboost
        params:
          n_estimators: 5000
          early_stopping_rounds: 150
          objective: multi:softprob
          eval_metric: mlogloss
          tree_method: hist
          num_class: 3
          random_state: 1
          n_jobs: -1

      optimizer:
        name: bayes_search_cv
        params:
          n_iter: 200
          scoring: neg_log_loss
          random_state: 1
          n_jobs: 1
          verbose: 0
          cv: 5
          search_spaces:
            max_depth: { type: Integer, low: 2, high: 8 }
            learning_rate: { type: Real, low: 0.001, high: 0.1, prior: log-uniform }
            min_child_weight: { type: Integer, low: 8, high: 60 }
            gamma: { type: Real, low: 1.0, high: 10.0 }
            subsample: { type: Real, low: 0.3, high: 0.8 }
            colsample_bytree: { type: Real, low: 0.2, high: 0.8 }
            reg_alpha: { type: Real, low: 0.1, high: 10, prior: log-uniform }
            reg_lambda: { type: Real, low: 1.0, high: 50, prior: log-uniform }

llm:
  default:
    provider: anthropic
    model: claude-sonnet-4-6
    vision_support: true
    max_tokens: 1024
    temperature: 0.3

  chat:
    provider: deepseek
    model: deepseek-chat
    vision_support: false
    temperature: 0.3
    max_context_tokens: 8000
    max_tokens_per_hour: 50000
    max_tokens_per_day: 100000

auth:
  allowed_origins: []
  token_expire_days: 30
  jwt:
    algorithm: HS256
  otp:
    code_ttl: 600
    cooldown_ttl: 60
    ip_daily_limit: 5
    email_daily_limit: 3
    max_wrong_attempts: 3
    email_whitelist:
      - developer@example.com
