logger:
  level: info
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - kind: console
    - kind: file
      path: "output/logs/octopus.log"
      max_size: 10485760
      backup_count: 5

task_thread_pool:
  max_workers: 64

browser:
  request_interval: 30.0
  page_pool_size: 5
  sys_mem_threshold: 90
  failure_threshold: 5
  addons:
    - "core/browser/extensions/oddsportal_tracer"
  launch_options:
    headless: true
    geoip: true
    os:
      - "windows"
      - "macos"
    humanize: true
    firefox_user_prefs:
      browser.tabs.remote.useCrossOriginOpenerPolicy: false
      network.cookie.cookieBehavior: 0
    # proxy:
    #   server: "http://127.0.0.1:7890"
  viewport:
    width: 1920
    height: 1080

http:
  host: "127.0.0.1"
  port: 8080

database:
  db_host: "localhost"
  db_port: 5432
  db_name: "octopus"
  db_user: "octopus"
  db_password: "123456"
  pool_config:
    pool_size: 20
    max_overflow: 30
    pool_timeout: 60
    pool_pre_ping: true
    pool_recycle: 300

resource:
  model: artifacts/models
  report: artifacts/reports
  dataset:
    training: artifacts/dataset/training
    prediction: artifacts/dataset/prediction
  asset: assets

training:
  tasks:
    winball:
      objective:
        type: classification
        target_col: "target"
        target_names: ["Home Loss", "Draw", "Home Win"]
        eval_set_size: 0.1
        calibration_set_size: 0
        test_set_size: 0.2

      model:
        name: xgboost
        params:
          n_estimators: 5000
          early_stopping_rounds: 150
          objective: multi:softprob
          eval_metric: mlogloss
          tree_method: hist
          num_class: 3
          random_state: 1
          n_jobs: -1

      optimizer:
        name: bayes_search_cv
        params:
          n_iter: 200
          scoring: neg_log_loss
          random_state: 1
          n_jobs: 1
          verbose: 0
          cv: 5
          search_spaces:
            max_depth: { type: Integer, low: 2, high: 8 }
            learning_rate: { type: Real, low: 0.001, high: 0.05, prior: log-uniform }
            min_child_weight: { type: Integer, low: 10, high: 60 }
            gamma: { type: Real, low: 1.0, high: 10.0 }
            subsample: { type: Real, low: 0.4, high: 0.8 }
            colsample_bytree: { type: Real, low: 0.3, high: 0.8 }
            reg_alpha: { type: Real, low: 0.1, high: 10, prior: log-uniform }
            reg_lambda: { type: Real, low: 2.0, high: 50, prior: log-uniform }
