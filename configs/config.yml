logger:
  level: info
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - kind: console
    - kind: file
      path: "output/logs/octopus.log"
      max_size: 10485760
      backup_count: 5

task_thread_pool:
  max_workers: 64

browser:
  request_interval: 20.0
  max_backoff: 300.0
  page_pool_size: 5
  sys_mem_threshold: 90
  failure_threshold: 5
  addons:
    - "core/browser/extensions/oddsportal_tracer"
  launch_options:
    headless: true
    geoip: true
    os:
      - "windows"
      - "macos"
    humanize: true
    firefox_user_prefs:
      browser.tabs.remote.useCrossOriginOpenerPolicy: false
      network.cookie.cookieBehavior: 0
  viewport:
    width: 1920
    height: 1080

database:
  pool_config:
    pool_size: 20
    max_overflow: 30
    pool_timeout: 60
    pool_pre_ping: true
    pool_recycle: 300

resource:
  model: artifacts/models
  report: artifacts/reports
  dataset:
    training: artifacts/dataset/training
    prediction: artifacts/dataset/prediction
  asset: assets

training:
  tasks:
    winball_club:
      objective:
        type: classification
        target_col: "target"
        target_names: ["Home Loss", "Draw", "Home Win"]
        eval_set_size: 0.1
        calibration_set_size: 0.1
        test_set_size: 0.2
        exclude_cols:
          - "market_median_ah_line"
          - "market_median_away_real"
          - "market_median_home_real"
          - "market_home_bias_ratio"
          - "market_median_draw_real"
          - "market_median_vig_close"
          - "market_median_home_log_return"
          - "market_median_away_log_return"
          - "market_median_draw_log_return"
          - "sharp_source_level"
          - "bookmaker_count"
          - "home_prob_open_std"
          - "away_prob_open_std"
          - "home_prob_close_std"
          - "away_prob_close_std"
          - "market_vig_open_std"
          - "market_vig_close_std"
          - "home_prob_up_ratio"
          - "away_prob_up_ratio"
          - "ah_line_up_ratio"
          - "sharp_vs_market_home_open_diff"
          - "sharp_vs_market_away_open_diff"
          - "sharp_vs_market_home_close_diff"
          - "sharp_vs_market_away_close_diff"
          - "sharp_pure_home_log_return"
          - "sharp_pure_away_log_return"
          - "home_std_change"
          - "synthetic_vig_close"
          - "market_entropy_close"

      model:
        name: xgboost
        params:
          n_estimators: 5000
          early_stopping_rounds: 150
          objective: multi:softprob
          eval_metric: mlogloss
          tree_method: hist
          num_class: 3
          random_state: 1
          n_jobs: -1

      optimizer:
        name: bayes_search_cv
        params:
          n_iter: 300
          scoring: neg_log_loss
          random_state: 1
          n_jobs: 1
          verbose: 0
          cv: 5
          search_spaces:
            max_depth: { type: Integer, low: 2, high: 8 }
            learning_rate: { type: Real, low: 0.001, high: 0.1, prior: log-uniform }
            min_child_weight: { type: Integer, low: 1, high: 60 }
            gamma: { type: Real, low: 0.0, high: 10.0 }
            subsample: { type: Real, low: 0.3, high: 0.8 }
            colsample_bytree: { type: Real, low: 0.2, high: 0.8 }
            reg_alpha: { type: Real, low: 0.1, high: 10, prior: log-uniform }
            reg_lambda: { type: Real, low: 1.0, high: 50, prior: log-uniform }

    winball_national:
      objective:
        type: classification
        target_col: "target"
        target_names: ["Home Loss", "Draw", "Home Win"]
        eval_set_size: 0.1
        calibration_set_size: 0.1
        test_set_size: 0.2
        exclude_cols:
          - "market_median_away_real"
          - "market_median_home_real"
          - "market_median_draw_real"
          - "market_median_ah_line"
          - "market_home_bias_ratio"
          - "market_median_vig_close"
          - "sharp_vs_market_away_open_diff"
          - "sharp_vs_market_home_close_diff"
          - "sharp_vs_market_home_open_diff"
          - "sharp_vs_market_away_close_diff"
          - "market_median_draw_log_return"
          - "market_median_away_log_return"
          - "market_median_home_log_return"
          - "synthetic_vig_close"
          - "market_vig_open_std"
          - "market_vig_close_std"
          - "away_prob_open_std"
          - "home_prob_open_std"
          - "away_prob_close_std"
          - "home_prob_close_std"
          - "away_prob_up_ratio"
          - "home_prob_up_ratio"
          - "ah_line_up_ratio"
          - "bookmaker_count"
          - "sharp_source_level"
          - "sharp_pure_home_log_return"
          - "sharp_pure_away_log_return"
          - "home_std_change"
          - "market_entropy_close"
          - "home_net_advantage"
          - "home_venue_dependency"
          - "npxg_ema_5_diff"
          - "home_lagged_xg"
          - "away_is_host"
          - "npxga_ema_5_diff"
          - "is_tournament"
          - "home_is_host"
          - "goal_to_xg_ema_5_diff"
          - "away_keeper_performance_ema_5"
          - "home_keeper_performance_ema_5"
          - "keeper_performance_ema_5_diff"
          - "final_third_entry_rate_ema_5_diff"
          - "away_disruption_ema_5"
          - "home_shots_on_target_ema_5"
          - "away_shots_ema_5"
          - "shots_on_target_ema_5_diff"
          - "home_npxg_ema_5"

      model:
        name: xgboost
        params:
          n_estimators: 5000
          early_stopping_rounds: 150
          objective: multi:softprob
          eval_metric: mlogloss
          tree_method: hist
          num_class: 3
          random_state: 1
          n_jobs: -1

      optimizer:
        name: bayes_search_cv
        params:
          n_iter: 300
          scoring: neg_log_loss
          random_state: 1
          n_jobs: 1
          verbose: 0
          cv: 5
          search_spaces:
            max_depth: { type: Integer, low: 3, high: 5 }
            learning_rate: { type: Real, low: 0.001, high: 0.1, prior: log-uniform }
            min_child_weight: { type: Integer, low: 3, high: 30 }
            gamma: { type: Real, low: 0.0, high: 10.0 }
            subsample: { type: Real, low: 0.3, high: 0.8 }
            colsample_bytree: { type: Real, low: 0.3, high: 0.8 }
            reg_alpha: { type: Real, low: 0.1, high: 10, prior: log-uniform }
            reg_lambda: { type: Real, low: 0.1, high: 10, prior: log-uniform }

llm:
  default:
    provider: anthropic
    model: claude-sonnet-4-6
    vision_support: true
    max_tokens: 1024
    temperature: 0.3

  chat:
    provider: deepseek
    model: deepseek-chat
    vision_support: false
    temperature: 0.3
    max_context_tokens: 8000
    max_tokens_per_hour: 50000
    max_tokens_per_day: 100000

auth:
  allowed_origins: []
  token_expire_days: 30
  jwt:
    algorithm: HS256
  otp:
    code_ttl: 600
    cooldown_ttl: 60
    ip_daily_limit: 5
    email_daily_limit: 3
    max_wrong_attempts: 3
